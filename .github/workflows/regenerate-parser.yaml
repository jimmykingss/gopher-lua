# Regenerates parse/parser.go from parse/parser.go.y with goyacc, commits it
# back to the branch, then builds and runs the tests.
#
# Run it manually from the Actions tab ("Run workflow") on the branch you want
# to update. The regenerated parser.go is saved as a commit on that branch. The
# goyacc output and the test results are shown on the run's Summary page.
#
# Needs: Settings > Actions > General > Workflow permissions > Read and write.
name: regenerate-parser
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: stable
    - name: Install goyacc
      run: go install golang.org/x/tools/cmd/goyacc@latest
    - name: Regenerate parser.go
      shell: bash
      working-directory: parse
      run: |
        mkdir -p "$RUNNER_TEMP/results"
        "$(go env GOPATH)/bin/goyacc" -o parser.go parser.go.y 2>&1 | tee "$RUNNER_TEMP/results/goyacc.log"
        rm -f y.output
    - name: Commit parser.go
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add parse/parser.go
        if git diff --cached --quiet; then
          echo "parser.go is already up to date"
        else
          git commit -m "Regenerate parse/parser.go with goyacc"
          git push origin "HEAD:${GITHUB_REF_NAME}"
        fi
    - name: Inline, format and build
      run: |
        ./_tools/go-inline *.go
        go fmt ./...
        go build ./...
    - name: Commit formatting changes, if any
      run: |
        git add -u   # tracked files only, never new files
        if git diff --cached --quiet; then
          echo "nothing to format"
        else
          git commit -m "go fmt"
          git push origin "HEAD:${GITHUB_REF_NAME}"
        fi
    - name: Run tests
      id: tests
      shell: bash
      run: |
        set +e
        go test -v ./... 2>&1 | tee "$RUNNER_TEMP/results/test.log"
        echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
    - name: Summarize
      if: always()
      shell: bash
      run: |
        R="$RUNNER_TEMP/results"
        {
          echo "## goyacc"
          if [ -s "$R/goyacc.log" ]; then
            echo '```'
            cat "$R/goyacc.log"
            echo '```'
          else
            echo "goyacc finished with no messages (no conflicts, no errors)."
          fi
          echo
          echo "## Test results"
          if [ "${{ steps.tests.outputs.status }}" = "0" ]; then
            echo "All tests passed."
          else
            echo "Some tests failed. First failures, with context:"
            echo '```'
            grep -n -B15 -A25 -m3 -E '^[[:space:]]*--- FAIL|^panic:' "$R/test.log" | head -150
            echo '```'
            echo "Package results:"
            echo '```'
            grep -E '^(ok|FAIL|---|\?)[[:space:]]' "$R/test.log" | grep -v -E '^--- PASS'
            echo '```'
          fi
        } > "$RUNNER_TEMP/summary.md"
        cat "$RUNNER_TEMP/summary.md"
        cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
    - name: Fail the job if tests failed
      if: steps.tests.outputs.status != '0'
      run: exit 1
